spring.application.name=gateway-service
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=8080
server.error.include-message=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
bank.internal-secret=${BANK_INTERNAL_SECRET}
spring.threads.virtual.enabled=true
bank.services.identity-url=${IDENTITY_URL:http://127.0.0.1:8081}
bank.services.ledger-url=${LEDGER_URL:http://127.0.0.1:8082}
bank.services.payment-url=${PAYMENT_URL:http://127.0.0.1:8083}
bank.services.notification-url=${NOTIFICATION_URL:http://127.0.0.1:8084}
bank.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
