spring.application.name=identity-service
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=8081
server.error.include-message=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
bank.internal-secret=${BANK_INTERNAL_SECRET}
spring.threads.virtual.enabled=true
spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:55432}/bank_identity
spring.datasource.username=${BANK_DB_USER:bank_admin}
spring.datasource.password=${BANK_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.password=${BANK_DB_PASSWORD:}
spring.flyway.enabled=true
bank.email.mode=${EMAIL_MODE:smtp}
bank.email.from=${EMAIL_FROM:no-reply@northstar.local}
bank.email.capture-dir=${EMAIL_CAPTURE_DIR:/tmp/northstar-email-capture}
spring.mail.host=${SMTP_HOST:host.containers.internal}
spring.mail.port=${SMTP_PORT:25}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
bank.services.identity-url=${IDENTITY_URL:http://127.0.0.1:8081}
bank.services.ledger-url=${LEDGER_URL:http://127.0.0.1:8082}
bank.services.payment-url=${PAYMENT_URL:http://127.0.0.1:8083}
bank.services.notification-url=${NOTIFICATION_URL:http://127.0.0.1:8084}
